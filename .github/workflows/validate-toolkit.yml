# Portfolio validation
name: Validate toolkit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Restore versioned R environment
        run: Rscript scripts/restore_environment.R
      - name: Run tests
        run: >-
          Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary")'
      - name: Run example audit
        run: Rscript examples/run_audit.R
      - name: Confirm report output
        run: >-
          Rscript -e 'stopifnot(file.exists("outputs/quality-issues.csv"), file.exists("outputs/quality-report.md"))'
